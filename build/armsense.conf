# armsense.conf -- shared settings for the armsense build scripts.  Sourced by sh.
# Lives in the overlay directory copied to the build VM as /usr/armsense/overlay.

PRODUCT_NAME=armsense
PRODUCT_LABEL=armsense
PRODUCT_URL=https://github.com/yadvlabs/armsense
PRODUCT_EMAIL=armsense@labs.yadv.in

# Factory admin password and its bcrypt hash (htpasswd -nbB -C 10 admin <password>).
DEFAULT_PASSWORD=armsense
DEFAULT_PASSWORD_HASH='$2y$10$VzztKzigatvbpm213kXY1ebWRIofivn4Q0e0kj3gri4U6OIoIbN5y'

A=/usr/armsense
SRC_FREEBSD=$A/src/FreeBSD-src
SRC_PORTS=$A/src/FreeBSD-ports
SRC_PFSENSE=$A/src/pfsense
JAILROOT=$A/jail
DISTFILES=$A/distfiles
LOGS=$A/logs
OBJ=$A/obj

# Upstream branches the armsense branches are cut from.
PFSENSE_BRANCH=master
FREEBSD_BRANCH=devel-main
PORTS_BRANCH=devel

# poudriere names follow the pfSense builder convention so the repository URL
# templates (sysutils/*-repo) resolve to the poudriere package directories:
#   jail  = ${PRODUCT_NAME}_${pfsense branch}_${arch}
#   ports = ${PRODUCT_NAME}_${ports branch}
JAIL_NAME=${PRODUCT_NAME}_${PFSENSE_BRANCH}_aarch64
PORTS_NAME=${PRODUCT_NAME}_${PORTS_BRANCH}

# Package repository base URL as seen from test VMs.  10.0.2.2 is the host
# address under QEMU user networking; packages are served from the Mac.
PKG_REPO_SERVER=http://10.0.2.2:8000/packages
